<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burning crew B.C</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; padding-bottom: 90px; margin: 0; }
.header { background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%); padding: 12px; text-align: center; font-weight: bold; font-size: 1.2rem; color: white; position: sticky; top: 0; z-index: 100; }
.nav-tabs { background: white; border-bottom: 2px solid #dee2e6; display: flex; overflow-x: auto; flex-wrap: nowrap; position: sticky; top: 50px; z-index: 99; -webkit-overflow-scrolling: touch; }
.nav-tabs .nav-link { font-weight: 600; color: #495057; border: none; padding: 10px 12px; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; }
.nav-tabs .nav-link.active { background-color: #0d6efd !important; color: white !important; border-bottom: 3px solid #004085; }
.tab-content-item { display: none; padding: 10px; }
.tab-content-item.active-tab { display: block !important; }
.card { margin-top: 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #dee2e6; background: #fff; }
.card-header { font-weight: bold; background-color: #fff; border-bottom: 2px solid #0d6efd; padding: 10px 12px; font-size: 0.95rem; }
.card-body { padding: 10px 12px; }
.table { font-size: 0.8rem; margin-bottom: 0; }
.table th, .table td { text-align: center; vertical-align: middle; padding: 6px 3px; }
.table th { font-weight: 600; background-color: #f8f9fa; font-size: 0.7rem; }
.member-card { background: white; border: 1px solid #dee2e6; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
.member-card.checked { background-color: #e7f3ff; border-color: #0d6efd; }
.member-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 0.75rem; margin-top: 6px; }
.member-option-label { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 6px 2px; background-color: #f8f9fa; border-radius: 4px; border: 1px solid #dee2e6; cursor: pointer; }
.score-input-row { background: white; border: 1px solid #dee2e6; border-radius: 6px; padding: 8px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.score-input-row input[type="number"] { width: 65px; text-align: center; font-weight: bold; font-size: 1rem; }
.mission-summary-box { background: #e3f2fd; border: 1px solid #b6d4fe; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.85rem; line-height: 1.4; }
.paid-row { background-color: #e8f5e9 !important; }
.paid-check-input { width: 20px; height: 20px; cursor: pointer; }
.fab-container { position: fixed; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
.fab { width: 48px; height: 48px; border-radius: 50%; background: #0d6efd; color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 3px 8px rgba(0,0,0,0.3); cursor: pointer; }
</style>
</head>
<body>

<div class="header">
<i class="fas fa-bowling-ball"></i> Burning crew B.C
</div>

<ul class="nav nav-tabs nav-justified" id="mainTab" role="tablist">
<li class="nav-item"><button class="nav-link active" id="setting-tab" onclick="openTab('setting')"><i class="fas fa-cog"></i> 설정</button></li>
<li class="nav-item"><button class="nav-link" id="fee-tab" onclick="openTab('fee')"><i class="fas fa-wallet"></i> 돈</button></li>
<li class="nav-item"><button class="nav-link" id="g1-tab" onclick="openTab('g1')">1G</button></li>
<li class="nav-item"><button class="nav-link" id="g2-tab" onclick="openTab('g2')">2G</button></li>
<li class="nav-item"><button class="nav-link" id="g3-tab" onclick="openTab('g3')">3G</button></li>
<li class="nav-item"><button class="nav-link" id="g4-tab" onclick="openTab('g4')">4G</button></li>
<li class="nav-item"><button class="nav-link" id="prize-tab" onclick="openTab('prize')"><i class="fas fa-trophy"></i> 순위</button></li>
</ul>

<div class="container-fluid px-2">
<!-- 1. 설정 탭 -->
<div id="tab-setting" class="tab-content-item active-tab">
<div class="card">
<div class="card-header"><i class="fas fa-sliders-h"></i> 핸디 및 기본 비용 설정</div>
<div class="card-body">
<div class="row g-2">
<div class="col-4"><label class="form-label fw-bold small">여성핸디</label><input type="number" inputmode="numeric" id="femaleHandicap" class="form-control form-control-sm" value="15" onchange="calculateAll()"></div>
<div class="col-4"><label class="form-label fw-bold small">남성한도</label><input type="number" inputmode="numeric" id="maleLimit" class="form-control form-control-sm" value="210" onchange="calculateAll()"></div>
<div class="col-4"><label class="form-label fw-bold small">여성한도</label><input type="number" inputmode="numeric" id="femaleLimit" class="form-control form-control-sm" value="200" onchange="calculateAll()"></div>
<div class="col-4"><label class="form-label fw-bold small">게임비</label><input type="number" inputmode="numeric" id="gameFee" class="form-control form-control-sm" value="14000" onchange="renderFeeTable()"></div>
<div class="col-4"><label class="form-label fw-bold small">팀전비</label><input type="number" inputmode="numeric" id="teamFee" class="form-control form-control-sm" value="8000" onchange="renderFeeTable()"></div>
<div class="col-4"><label class="form-label fw-bold small">사이드</label><input type="number" inputmode="numeric" id="sideFee" class="form-control form-control-sm" value="20000" onchange="renderFeeTable()"></div>
</div>
</div>
</div>

<div class="card">
<div class="card-header d-flex justify-content-between align-items-center">
<span><i class="fas fa-cloud"></i> 구글 시트 연동</span>
<button class="btn btn-primary btn-sm py-0 px-2" style="font-size: 0.75rem;" onclick="fetchGoogleSheetApi()">동기화</button>
</div>
<div class="card-body">
<input type="text" id="apiUrl" class="form-control form-control-sm mb-2" placeholder="Apps Script Web App API URL 입력">
<textarea id="memberDBText" class="form-control form-control-sm mb-2" rows="2" placeholder="명단 데이터"></textarea>
<button class="btn btn-secondary btn-sm w-100" onclick="saveMemberDB()">명단 수동 적용</button>
</div>
</div>

<div class="card">
<div class="card-header"><i class="fas fa-users"></i> 참석자 선택 및 옵션 지정</div>
<div class="card-body">
<div id="attendeeCheckboxes" class="mb-2"></div>
<button class="btn btn-success w-100 btn-sm fw-bold py-2" onclick="loadAttendees()">참석자 확정 ➔</button>
</div>
</div>
</div>

<!-- 2. 걷을돈 탭 -->
<div id="tab-fee" class="tab-content-item">
<div class="card">
<div class="card-header d-flex justify-content-between align-items-center">
<span><i class="fas fa-receipt"></i> 걷을 돈 요약 및 항목별 총액</span>
<span id="paidSummaryBadge" class="badge bg-success">입금: 0명</span>
</div>
<div class="card-body p-2">
<div id="feeCategorySummary" class="alert alert-primary p-2 mb-2 small" style="line-height: 1.5;"></div>
<div class="table-responsive">
<table class="table table-bordered mb-0">
<thead class="bg-light">
<tr>
<th>이름</th>
<th>게임비</th>
<th>팀전</th>
<th>사이드</th>
<th>미션(AC/TT)</th>
<th>총 입금액</th>
<th>입금</th>
</tr>
</thead>
<tbody id="feeTableBody">
<tr><td colspan="7" class="text-muted text-center py-3">참석자를 먼저 확정해주세요.</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

<!-- 3~6. 1G~4G 탭 -->
<div id="tab-g1" class="tab-content-item"><div class="card"><div class="card-header">1게임 점수 입력</div><div class="card-body p-2"><div id="g1ScoreInputs"></div><div id="g1MissionSummary" class="mission-summary-box"></div></div></div></div>
<div id="tab-g2" class="tab-content-item"><div class="card"><div class="card-header">2게임 점수 입력</div><div class="card-body p-2"><div id="g2ScoreInputs"></div><div id="g2MissionSummary" class="mission-summary-box"></div></div></div></div>
<div id="tab-g3" class="tab-content-item"><div class="card"><div class="card-header">3게임 점수 입력</div><div class="card-body p-2"><div id="g3ScoreInputs"></div><div id="g3MissionSummary" class="mission-summary-box"></div></div></div></div>
<div id="tab-g4" class="tab-content-item"><div class="card"><div class="card-header">4게임 점수 입력</div><div class="card-body p-2"><div id="g4ScoreInputs"></div><div id="g4MissionSummary" class="mission-summary-box"></div></div></div></div>

<!-- 7. 상금 탭 -->
<div id="tab-prize" class="tab-content-item">
<div class="card">
<div class="card-header d-flex justify-content-between align-items-center">
<span>게임별 1~3위 및 최종 순위</span>
<button class="btn btn-outline-primary btn-sm py-0 px-2" onclick="copyKakaoSummary()">카톡 복사</button>
</div>
<div class="card-body p-2"><div id="prizeTableBody"></div></div>
</div>
<div class="card">
<div class="card-header">정산 요약 및 저장</div>
<div class="card-body text-center">
<div id="settlementSummary" class="text-start mb-2 small">-</div>
<button class="btn btn-primary w-100 btn-sm fw-bold py-2" onclick="saveToGoogleSheet()">☁️ 구글 시트로 최종 저장</button>
</div>
</div>
</div>
</div>

<div class="fab-container">
<button class="fab" onclick="resetAll()"><i class="fas fa-redo"></i></button>
<button class="fab" onclick="saveState(true)" style="background: #28a745;"><i class="fas fa-save"></i></button>
</div>

<script>
let membersDB = [];
let attendees = [];
const STORAGE_KEY = "burning_crew_state_v7";

window.onload = function() { loadStoredState(); };

function openTab(tabName) {
    document.querySelectorAll('.tab-content-item').forEach(el => el.classList.remove('active-tab'));
    document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
    
    let targetTab = document.getElementById("tab-" + tabName);
    let targetBtn = document.getElementById(tabName + "-tab");
    
    if (targetTab) targetTab.classList.add('active-tab');
    if (targetBtn) targetBtn.classList.add('active');
    
    if(tabName === 'fee') renderFeeTable();
    if(tabName === 'prize') renderPrizeTable();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveState(showMsg = false) {
    let state = {
        femaleHandicap: document.getElementById("femaleHandicap").value,
        maleLimit: document.getElementById("maleLimit").value,
        femaleLimit: document.getElementById("femaleLimit").value,
        gameFee: document.getElementById("gameFee").value,
        teamFee: document.getElementById("teamFee").value,
        sideFee: document.getElementById("sideFee").value,
        attendees: attendees
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(showMsg) alert("✅ 저장되었습니다!");
}

function loadStoredState() {
    let saved = localStorage.getItem(STORAGE_KEY);
    if(saved) {
        try {
            let state = JSON.parse(saved);
            document.getElementById("femaleHandicap").value = state.femaleHandicap || 15;
            document.getElementById("maleLimit").value = state.maleLimit || 210;
            document.getElementById("femaleLimit").value = state.femaleLimit || 200;
            document.getElementById("gameFee").value = state.gameFee || 14000;
            document.getElementById("teamFee").value = state.teamFee || 8000;
            document.getElementById("sideFee").value = state.sideFee || 20000;
            attendees = state.attendees || [];
        } catch(e) {}
    }
    let savedDB = localStorage.getItem("burning_members");
    if(savedDB) {
        document.getElementById("memberDBText").value = savedDB;
        parseMemberDB();
    }
    let savedApi = localStorage.getItem("burning_api_url");
    if(savedApi) document.getElementById("apiUrl").value = savedApi;

    if(attendees.length > 0) calculateAll();
}

function resetAll() {
    if(confirm("초기화하시겠습니까?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

async function fetchGoogleSheetApi() {
    let url = document.getElementById("apiUrl").value.trim();
    if(!url) { alert("API URL을 입력해주세요."); return; }
    localStorage.setItem("burning_api_url", url);
    try {
        let res = await fetch(url);
        let data = await res.json();
        let list = Array.isArray(data) ? data : (data.members || []);
        let text = "";
        list.forEach(i => { text += `${i.name||i[0]} ${i.ave||i[1]} ${i.gender||i[2]||'남'} ${i.attendRate||0}\n`; });
        document.getElementById("memberDBText").value = text.trim();
        saveMemberDB();
        alert("동기화 완료!");
    } catch(e) { alert("연동 오류"); }
}

function saveMemberDB() {
    let text = document.getElementById("memberDBText").value;
    localStorage.setItem("burning_members", text);
    parseMemberDB();
}

function parseMemberDB() {
    let lines = document.getElementById("memberDBText").value.split("\n");
    membersDB = [];
    let container = document.getElementById("attendeeCheckboxes");
    container.innerHTML = "";
    lines.forEach((line, index) => {
        let p = line.trim().split(/\s+/);
        if(p.length >= 2) {
            let name = p[0], ave = parseInt(p[1])||0, gender = p[2]||'남', rate = parseFloat(p[3])||0;
            let auto = rate >= 50;
            membersDB.push({ name, ave, gender });
            container.innerHTML += `
                <div class="member-card ${auto?'checked':''}">
                    <label class="d-flex align-items-center gap-2 m-0 fw-bold">
                        <input class="form-check-input member-check" type="checkbox" value="${index}" ${auto?'checked':''} onchange="this.closest('.member-card').classList.toggle('checked', this.checked)">
                        ${name} <span class="badge bg-secondary">${gender}</span> <span class="text-muted small">Avg ${ave}</span>
                    </label>
                    <div class="member-options">
                        <label class="member-option-label"><input type="checkbox" id="side_${index}" checked> 사이드</label>
                        <label class="member-option-label"><input type="checkbox" id="ac_${index}" checked> AC</label>
                        <label class="member-option-label"><input type="checkbox" id="tt_${index}" checked> TT</label>
                    </div>
                </div>`;
        }
    });
}

function loadAttendees() {
    let checks = document.querySelectorAll(".member-check:checked");
    if(checks.length === 0) { alert("참석자를 선택해주세요."); return; }
    attendees = [];
    checks.forEach(chk => {
        let idx = parseInt(chk.value);
        let m = membersDB[idx];
        attendees.push({
            name: m.name, ave: m.ave, gender: m.gender,
            joinSide: document.getElementById(`side_${idx}`).checked,
            joinAC: document.getElementById(`ac_${idx}`).checked,
            joinTT: document.getElementById(`tt_${idx}`).checked,
            isPaid: false, g1: 0, g2: 0, g3: 0, g4: 0,
            acSuccess: [false,false,false,false], ttSuccess: [false,false,false,false],
            acPrize: 0, ttPrize: 0, acRefund: false, ttRefund: false
        });
    });
    attendees.sort((a,b) => b.ave - a.ave);
    saveState();
    renderGameTables();
    calculateAll();
    openTab('fee');
}

function renderFeeTable() {
    let tbody = document.getElementById("feeTableBody");
    let summaryEl = document.getElementById("feeCategorySummary");
    if(!tbody || !summaryEl) return;
    tbody.innerHTML = "";

    let bGame = parseInt(document.getElementById("gameFee").value)||0;
    let bTeam = parseInt(document.getElementById("teamFee").value)||0;
    let bSide = parseInt(document.getElementById("sideFee").value)||0;

    let paidCount = 0, sumGame = 0, sumTeam = 0, sumSide = 0, sumAC = 0, sumTT = 0;
    let isAll4Finished = attendees.length > 0 && attendees.every(a => a.g4 > 0);

    attendees.forEach((a, idx) => {
        let sideVal = a.joinSide ? bSide : 0;
        let acFee = a.joinAC ? 8000 : 0;
        let ttFee = a.joinTT ? 4000 : 0;
        if(isAll4Finished) {
            if(a.acRefund) acFee = 0;
            if(a.ttRefund) ttFee = 0;
        }
        let missionVal = acFee + ttFee;
        let total = bGame + bTeam + sideVal + missionVal;

        sumGame += bGame; sumTeam += bTeam; sumSide += sideVal;
        if(!a.acRefund) sumAC += (a.joinAC?8000:0);
        if(!a.ttRefund) sumTT += (a.joinTT?4000:0);
        if(a.isPaid) paidCount++;

        tbody.innerHTML += `
            <tr class="${a.isPaid?'paid-row':''}">
                <td class="fw-bold">${a.name}</td>
                <td>${bGame.toLocaleString()}</td>
                <td>${bTeam.toLocaleString()}</td>
                <td>${sideVal.toLocaleString()}</td>
                <td>${missionVal.toLocaleString()}${ (a.acRefund||a.ttRefund)?'<br><small class="text-danger">환불</small>':''}</td>
                <td class="fw-bold text-primary">${total.toLocaleString()}</td>
                <td><input type="checkbox" class="paid-check-input" ${a.isPaid?'checked':''} onchange="attendees[${idx}].isPaid=this.checked; saveState(); renderFeeTable();"></td>
            </tr>`;
    });

    let grandTotal = sumGame + sumTeam + sumSide + sumAC + sumTT;
    summaryEl.innerHTML = `
        <b>📊 항목별 총 걷을 금액 요약</b><br>
        • 게임비 총액: ${sumGame.toLocaleString()}원 | 팀전비 총액: ${sumTeam.toLocaleString()}원<br>
        • 사이드 총액: ${sumSide.toLocaleString()}원 | 올카바 총액: ${sumAC.toLocaleString()}원 | 텐터키 총액: ${sumTT.toLocaleString()}원<br>
        • <b>전체 걷을 총 현금: <span class="text-primary">${grandTotal.toLocaleString()}원</span></b>
    `;
    let paidBadge = document.getElementById("paidSummaryBadge");
    if(paidBadge) paidBadge.innerText = `입금완료: ${paidCount}/${attendees.length}명`;
}

function renderGameTables() {
    for(let g=1; g<=4; g++) {
        let c = document.getElementById(`g${g}ScoreInputs`);
        if(!c) continue;
        c.innerHTML = "";
        attendees.forEach((a, idx) => {
            c.innerHTML += `
                <div class="score-input-row">
                    <div><b>${a.name}</b> <span class="badge bg-secondary">${a.gender}</span></div>
                    <input type="number" inputmode="numeric" min="0" max="300" value="${a['g'+g]||''}" placeholder="점수" onchange="updateScore(${idx}, ${g}, this.value)">
                    <span id="handi_${g}_${idx}" class="small text-primary fw-bold">-</span>
                    <div class="d-flex gap-1">
                        <label class="small"><input type="checkbox" ${!a.joinAC?'disabled':''} ${a.acSuccess[g-1]?'checked':''} onchange="updateMission(${idx}, ${g}, 'ac', this.checked)"> AC</label>
                        <label class="small"><input type="checkbox" ${!a.joinTT?'disabled':''} ${a.ttSuccess[g-1]?'checked':''} onchange="updateMission(${idx}, ${g}, 'tt', this.checked)"> TT</label>
                    </div>
                </div>`;
        });
    }
}

function updateScore(idx, g, val) {
    let s = parseInt(val)||0;
    if(s > 300) s = 300;
    attendees[idx]['g'+g] = s;
    calculateAll();
    saveState();
}

function updateMission(idx, g, type, checked) {
    if(type === 'ac') attendees[idx].acSuccess[g-1] = checked;
    if(type === 'tt') attendees[idx].ttSuccess[g-1] = checked;
    calculateAll();
    saveState();
}

function calculateAll() {
    let fHandi = parseInt(document.getElementById("femaleHandicap").value)||0;
    let mLimit = parseInt(document.getElementById("maleLimit").value)||210;
    let fLimit = parseInt(document.getElementById("femaleLimit").value)||200;
    let isAll4Finished = attendees.length > 0 && attendees.every(a => a.g4 > 0);

    attendees.forEach((a, idx) => {
        for(let g=1; g<=4; g++) {
            let raw = a['g'+g]||0;
            let calc = raw;
            if(a.gender === '여' || a.gender === 'F') {
                calc += fHandi;
                if(a.ave > fLimit && raw > 0) calc = Math.min(calc, fLimit);
            } else {
                if(a.ave > mLimit && raw > 0) calc = Math.min(calc, mLimit);
            }
            a['g'+g+'_calculated'] = calc;
            let el = document.getElementById(`handi_${g}_${idx}`);
            if(el) el.innerText = raw > 0 ? `${calc}점` : '-';
        }
        a.acPrize = 0; a.ttPrize = 0; a.acRefund = false; a.ttRefund = false;
    });

    let acCarry = 0, acWinAny = false, acDetails = [];
    for(let g=1; g<=4; g++) {
        let pool = (attendees.filter(a=>a.joinAC).length * 2000) + acCarry;
        let winners = attendees.filter(a => a.joinAC && a.acSuccess[g-1]);
        let prize = 0;
        if(winners.length > 0) {
            acWinAny = true;
            prize = Math.floor(pool / winners.length);
            winners.forEach(w => w.acPrize += prize);
            acCarry = 0;
        } else { acCarry = pool; }
        acDetails.push({ pool, winners, prize });
    }
    if(isAll4Finished && !acWinAny) attendees.forEach(a => { if(a.joinAC) a.acRefund = true; });

    let ttCarry = 0, ttWinAny = false, ttDetails = [];
    for(let g=1; g<=4; g++) {
        let pool = (attendees.filter(a=>a.joinTT).length * 1000) + ttCarry;
        let winners = attendees.filter(a => a.joinTT && a.ttSuccess[g-1]);
        let prize = 0;
        if(winners.length > 0) {
            ttWinAny = true;
            prize = Math.floor(pool / winners.length);
            winners.forEach(w => w.ttPrize += prize);
            ttCarry = 0;
        } else { ttCarry = pool; }
        ttDetails.push({ pool, winners, prize });
    }
    if(isAll4Finished && !ttWinAny) attendees.forEach(a => { if(a.joinTT) a.ttRefund = true; });

    renderFeeTable();
    renderMissionSummaries(acDetails, ttDetails);
    renderPrizeTable();
}

function renderMissionSummaries(acD, ttD) {
    for(let g=1; g<=4; g++) {
        let ac = acD[g-1], tt = ttD[g-1];
        let box = document.getElementById(`g${g}MissionSummary`);
        if(box) {
            let acText = ac.winners.length > 0 ? `성공 ${ac.winners.length}명 ➔ 인당 <b>${ac.prize.toLocaleString()}원</b>` : `없음 (이월 ${ac.pool.toLocaleString()}원)`;
            let ttText = tt.winners.length > 0 ? `성공 ${tt.winners.length}명 ➔ 인당 <b>${tt.prize.toLocaleString()}원</b>` : `없음 (이월 ${tt.pool.toLocaleString()}원)`;
            box.innerHTML = `
                <b>📌 ${g}G 미션 정산 내역</b><br>
                • 올카바(AC): ${acText}<br>
                • 텐터키(TT): ${ttText}
            `;
        }
    }
}

function renderPrizeTable() {
    let pContainer = document.getElementById("prizeTableBody");
    if(!pContainer) return;

    let gameRankings = [];
    for(let g=1; g<=4; g++) {
        let sorted = [...attendees]
            .filter(a => a['g'+g] > 0)
            .map(a => ({ name: a.name, score: a['g'+g+'_calculated'] }))
            .sort((a, b) => b.score - a.score);
        gameRankings.push(sorted);
    }

    let list = [...attendees].map(a => {
        let total = (a.g1_calculated||0) + (a.g2_calculated||0) + (a.g3_calculated||0) + (a.g4_calculated||0);
        return { ...a, total, avg: (total/4).toFixed(1), prize: (a.acPrize||0) + (a.ttPrize||0) };
    }).sort((a,b) => b.total - a.total);

    let html = "";
    for(let g=1; g<=4; g++) {
        let ranks = gameRankings[g-1];
        html += `<div class="mb-2 p-2 bg-light border rounded"><div class="fw-bold small text-primary mb-1">📌 ${g}게임 1~3위</div>`;
        if(ranks.length === 0) {
            html += `<div class="small text-muted">입력된 점수 없음</div>`;
        } else {
            html += `<div class="d-flex gap-2 flex-wrap small">`;
            ranks.slice(0, 3).forEach((r, idx) => {
                let medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : '🥉');
                html += `<div>${medal} <b>${r.name}</b> (${r.score}점)</div>`;
            });
            html += `</div>`;
        }
        html += `</div>`;
    }

    html += `<hr><div class="fw-bold mb-2">🏆 최종 합산 순위</div>`;
    list.forEach((a, idx) => {
        html += `
            <div class="result-row d-flex align-items-center justify-content-between p-2 border-bottom">
                <div><b>${idx+1}위</b> ${a.name} <span class="badge bg-secondary">${a.gender}</span></div>
                <div class="text-end"><b>${a.total}점</b> <small class="text-muted">(Avg ${a.avg})</small>${a.prize>0?`<br><span class="text-success small">상금: ${a.prize.toLocaleString()}원</span>`:''}</div>
            </div>`;
    });
    pContainer.innerHTML = html;

    let bGame = parseInt(document.getElementById("gameFee").value)||0;
    let bTeam = parseInt(document.getElementById("teamFee").value)||0;
    let bSide = parseInt(document.getElementById("sideFee").value)||0;
    let sideCount = attendees.filter(a => a.joinSide).length;

    let settlementEl = document.getElementById("settlementSummary");
    if(settlementEl) {
        settlementEl.innerHTML = `
            <div class="row text-start small">
                <div class="col-6 mb-1"><strong>총 참석자:</strong> ${attendees.length}명</div>
                <div class="col-6 mb-1"><strong>사이드 참여:</strong> ${sideCount}명</div>
                <div class="col-6 mb-1"><strong>게임비 총액:</strong> ${(attendees.length*bGame).toLocaleString()}원</div>
                <div class="col-6 mb-1"><strong>팀전비 총액:</strong> ${(attendees.length*bTeam).toLocaleString()}원</div>
                <div class="col-12 mt-1"><strong>사이드 총 적립금:</strong> <span class="text-primary fw-bold">${(sideCount*bSide).toLocaleString()}원</span></div>
            </div>
        `;
    }
}

function copyKakaoSummary() {
    if(attendees.length === 0) { alert("데이터 없음"); return; }
    let list = [...attendees].map(a => ({
        name: a.name, total: (a.g1_calculated||0)+(a.g2_calculated||0)+(a.g3_calculated||0)+(a.g4_calculated||0),
        prize: (a.acPrize||0) + (a.ttPrize||0)
    })).sort((a,b) => b.total - a.total);

    let text = `🎳 [Burning crew B.C 정산 결과]\n\n🏆 최종 순위:\n`;
    list.slice(0,3).forEach((r,i) => { text += `${i+1}위: ${r.name} (${r.total}점)\n`; });
    
    let winners = list.filter(r => r.prize > 0);
    if(winners.length > 0) {
        text += `\n🎯 미션 상금 획득:\n`;
        winners.forEach(w => { text += `• ${w.name}: ${w.prize.toLocaleString()}원\n`; });
    }
    navigator.clipboard.writeText(text).then(() => alert("카톡 복사 완료!"));
}

async function saveToGoogleSheet() {
    let url = document.getElementById("apiUrl").value.trim();
    if(!url) { alert("API URL 입력 필요"); return; }
    try {
        await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ attendees }) });
        alert("구글 시트 저장 완료!");
    } catch(e) { alert("저장 실패"); }
}
