<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burning crew B.C</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; padding-bottom: 90px; }
        .header { background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%); padding: 15px; text-align: center; font-weight: bold; font-size: 1.4rem; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header i { margin-right: 8px; }
        .nav-tabs { background: white; border-bottom: 2px solid #e9ecef; overflow-x: auto; -webkit-overflow-scrolling: touch; position: sticky; top: 57px; z-index: 99; gap: 0; display: flex; flex-wrap: nowrap; }
        .nav-tabs .nav-link { font-weight: 600; color: #495057; border: none; padding: 12px 12px; font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; border-bottom: 3px solid transparent; }
        .nav-tabs .nav-link.active { background-color: #0d6efd; color: white; border-bottom: 3px solid #0d6efd; }
        .card { margin-top: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e9ecef; }
        .card-header { font-weight: bold; background-color: #fff; border-bottom: 2px solid #0d6efd; padding: 12px 15px; border-radius: 10px 10px 0 0; }
        .card-body { padding: 12px 15px; }
        .table { font-size: 0.85rem; margin-bottom: 0; }
        .table th, .table td { text-align: center; vertical-align: middle; padding: 8px 4px; }
        .table th { font-weight: 600; background-color: #f8f9fa; font-size: 0.75rem; }
        .btn-custom { font-weight: 600; padding: 10px 15px; font-size: 0.95rem; border-radius: 6px; }
        .mission-summary-box { background: linear-gradient(135deg, #f1f8ff 0%, #e3f2fd 100%); border: 2px solid #b6d4fe; border-radius: 10px; padding: 12px; margin-top: 12px; }
        .form-control, .form-select { border-radius: 6px; border: 1px solid #dee2e6; padding: 8px 10px; font-size: 0.95rem; }
        .member-card { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .member-card.checked { background-color: #e7f3ff; border-color: #0d6efd; }
        .member-info { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
        .member-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 0.8rem; }
        .member-option-label { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; background-color: #f8f9fa; border-radius: 6px; cursor: pointer; border: 1px solid #e9ecef; }
        .score-input-row { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .score-input-row .name-area { display: flex; flex-direction: column; min-width: 65px; }
        .score-input-row .name { font-weight: 700; font-size: 0.9rem; }
        .score-input-row input[type="number"] { width: 75px; text-align: center; font-weight: bold; font-size: 1.05rem; }
        .score-input-row .score-result { min-width: 60px; text-align: center; font-weight: 700; color: #0d6efd; font-size: 0.95rem; }
        .score-input-row .mission-checks { display: flex; gap: 8px; }
        .score-input-row .mission-checks label { display: flex; align-items: center; gap: 2px; font-size: 0.75rem; font-weight: bold; background: #f8f9fa; padding: 4px 6px; border-radius: 4px; border: 1px solid #dee2e6; }
        .score-input-row .mission-checks input { width: 18px; height: 18px; cursor: pointer; }
        .badge { padding: 4px 6px; font-size: 0.7rem; font-weight: 600; }
        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .fab { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%); color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4); cursor: pointer; }
        .result-row { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .result-rank { font-weight: 800; font-size: 1.1rem; width: 36px; height: 36px; background-color: #f8f9fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0d6efd; }
        .result-info { flex: 1; margin-left: 10px; }
        .result-info .name { font-weight: 700; font-size: 0.95rem; }
        .result-info .score { color: #6c757d; font-size: 0.8rem; margin-top: 2px; }
        .result-score { font-weight: 800; font-size: 1.1rem; color: #0d6efd; text-align: right; }
        .paid-row { background-color: #e8f5e9 !important; }
        .paid-check-input { width: 22px; height: 22px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <i class="fas fa-bowling-ball"></i> Burning crew B.C
</div>

<ul class="nav nav-tabs nav-justified" id="mainTab" role="tablist">
    <li class="nav-item"><button class="nav-link active" id="setting-tab" onclick="openTab('setting')"><i class="fas fa-cog"></i> 설정</button></li>
    <li class="nav-item"><button class="nav-link" id="fee-tab" onclick="openTab('fee')"><i class="fas fa-wallet"></i> 돈</button></li>
    <li class="nav-item"><button class="nav-link" id="g1-tab" onclick="openTab('g1')">1G</button></li>
    <li class="nav-item"><button class="nav-link" id="g2-tab" onclick="openTab('g2')">2G</button></li>
    <li class="nav-item"><button class="nav-link" id="g3-tab" onclick="openTab('g3')">3G</button></li>
    <li class="nav-item"><button class="nav-link" id="g4-tab" onclick="openTab('g4')">4G</button></li>
    <li class="nav-item"><button class="nav-link" id="prize-tab" onclick="openTab('prize')"><i class="fas fa-trophy"></i> 순위</button></li>
</ul>

<div class="container-fluid">
    <!-- 1. 설정 탭 -->
    <div id="tab-setting" class="tab-content-item">
        <div class="card">
            <div class="card-header"><i class="fas fa-sliders-h"></i> 핸디 및 기본 비용 설정</div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">여성 핸디</label>
                        <input type="number" inputmode="numeric" id="femaleHandicap" class="form-control form-control-sm" value="15" onchange="calculateAll()">
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">남성 한도</label>
                        <input type="number" inputmode="numeric" id="maleLimit" class="form-control form-control-sm" value="210" onchange="calculateAll()">
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">여성 한도</label>
                        <input type="number" inputmode="numeric" id="femaleLimit" class="form-control form-control-sm" value="200" onchange="calculateAll()">
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">게임비</label>
                        <input type="number" inputmode="numeric" id="gameFee" class="form-control form-control-sm" value="14000" onchange="renderFeeTable()">
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">팀전비</label>
                        <input type="number" inputmode="numeric" id="teamFee" class="form-control form-control-sm" value="8000" onchange="renderFeeTable()">
                    </div>
                    <div class="col-6 col-md-4">
                        <label class="form-label fw-bold small">개인사이드</label>
                        <input type="number" inputmode="numeric" id="sideFee" class="form-control form-control-sm" value="20000" onchange="renderFeeTable()">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-cloud"></i> 구글 시트 명단 동기화</span>
                <button class="btn btn-primary btn-sm py-1 px-2" style="font-size: 0.8rem;" onclick="fetchGoogleSheetApi()"><i class="fas fa-sync"></i> 동기화</button>
            </div>
            <div class="card-body">
                <div class="mb-2">
                    <label class="form-label fw-bold small">Apps Script Web App API URL</label>
                    <input type="text" id="apiUrl" class="form-control form-control-sm" placeholder="https://script.google.com/macros/s/.../exec">
                </div>
                <textarea id="memberDBText" class="form-control form-control-sm" rows="3" placeholder="API 연결 시 자동으로 회원 목록이 로드됩니다."></textarea>
                <button class="btn btn-secondary btn-sm w-100 mt-2 btn-custom" onclick="saveMemberDB()"><i class="fas fa-download"></i> 명단 수동 적용</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-users"></i> 참석자 선택 및 옵션 지정</div>
            <div class="card-body">
                <div id="attendeeCheckboxes" class="mb-3"></div>
                <button class="btn btn-success w-100 btn-custom" onclick="loadAttendees()"><i class="fas fa-check"></i> 참석자 확정</button>
            </div>
        </div>
    </div>

    <!-- 2. 걷을돈 탭 -->
    <div id="tab-fee" class="tab-content-item" style="display:none;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-receipt"></i> 걷을 돈 요약</span>
                <span id="paidSummaryBadge" class="badge bg-success">입금완료: 0명</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>이름</th>
                                <th>게임비</th>
                                <th>팀전</th>
                                <th>사이드</th>
                                <th>미션</th>
                                <th>합계</th>
                                <th>입금</th>
                            </tr>
                        </thead>
                        <tbody id="feeTableBody">
                            <tr><td colspan="7" class="text-muted text-center py-3">참석자를 먼저 확정해주세요.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 3~6. 1G~4G 탭 -->
    <div id="tab-g1" class="tab-content-item" style="display:none;">
        <div class="card"><div class="card-header"><i class="fas fa-bowling-ball"></i> 1게임 점수 입력</div><div class="card-body p-2"><div id="g1ScoreInputs"></div><div id="g1MissionSummary" class="mission-summary-box" style="display:none;"></div></div></div>
    </div>
    <div id="tab-g2" class="tab-content-item" style="display:none;">
        <div class="card"><div class="card-header"><i class="fas fa-bowling-ball"></i> 2게임 점수 입력</div><div class="card-body p-2"><div id="g2ScoreInputs"></div><div id="g2MissionSummary" class="mission-summary-box" style="display:none;"></div></div></div>
    </div>
    <div id="tab-g3" class="tab-content-item" style="display:none;">
        <div class="card"><div class="card-header"><i class="fas fa-bowling-ball"></i> 3게임 점수 입력</div><div class="card-body p-2"><div id="g3ScoreInputs"></div><div id="g3MissionSummary" class="mission-summary-box" style="display:none;"></div></div></div>
    </div>
    <div id="tab-g4" class="tab-content-item" style="display:none;">
        <div class="card"><div class="card-header"><i class="fas fa-bowling-ball"></i> 4게임 점수 입력</div><div class="card-body p-2"><div id="g4ScoreInputs"></div><div id="g4MissionSummary" class="mission-summary-box" style="display:none;"></div></div></div>
    </div>

    <!-- 7. 상금 탭 -->
    <div id="tab-prize" class="tab-content-item" style="display:none;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-chart-bar"></i> 최종 순위</span>
                <button class="btn btn-outline-primary btn-sm py-1" onclick="copyKakaoSummary()"><i class="fas fa-copy"></i> 카톡 복사</button>
            </div>
            <div class="card-body p-2">
                <div id="prizeTableBody"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-info-circle"></i> 정산 요약 및 저장</div>
            <div class="card-body text-center">
                <div id="settlementSummary" class="text-start mb-3">-</div>
                <button class="btn btn-primary w-100 btn-custom" onclick="saveToGoogleSheet()"><i class="fas fa-cloud-upload-alt"></i> ☁️ 구글 시트로 최종 저장</button>
            </div>
        </div>
    </div>
</div>

<div class="fab-container">
    <button class="fab" title="초기화" onclick="resetAll()"><i class="fas fa-redo"></i></button>
    <button class="fab" title="저장" onclick="saveState(true)" style="background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);"><i class="fas fa-save"></i></button>
</div>

<script>
    let membersDB = [];
    let attendees = [];
    const STORAGE_KEY = "burning_crew_state_v2";
    const API_URL_KEY = "burning_api_url";
    const MEMBER_DB_KEY = "burning_members";

    window.onload = function() {
        loadStoredState();
    };

    function saveState(showMsg = false) {
        let state = {
            femaleHandicap: document.getElementById("femaleHandicap").value,
            maleLimit: document.getElementById("maleLimit").value,
            femaleLimit: document.getElementById("femaleLimit").value,
            gameFee: document.getElementById("gameFee").value,
            teamFee: document.getElementById("teamFee").value,
            sideFee: document.getElementById("sideFee").value,
            attendees: attendees,
            timestamp: new Date().toISOString()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(showMsg) showToast("✅ 현재 상태가 저장되었습니다");
    }

    function loadStoredState() {
        let savedState = localStorage.getItem(STORAGE_KEY);
        if(savedState) {
            try {
                let state = JSON.parse(savedState);
                document.getElementById("femaleHandicap").value = state.femaleHandicap || 15;
                document.getElementById("maleLimit").value = state.maleLimit || 210;
                document.getElementById("femaleLimit").value = state.femaleLimit || 200;
                document.getElementById("gameFee").value = state.gameFee || 14000;
                document.getElementById("teamFee").value = state.teamFee || 8000;
                document.getElementById("sideFee").value = state.sideFee || 20000;
                attendees = state.attendees || [];
            } catch(e) { console.log(e); }
        }

        let savedApiUrl = localStorage.getItem(API_URL_KEY);
        if(savedApiUrl) document.getElementById("apiUrl").value = savedApiUrl;

        let savedDB = localStorage.getItem(MEMBER_DB_KEY);
        if(savedDB && savedDB.trim() !== "") {
            document.getElementById("memberDBText").value = savedDB;
            parseMemberDB();
        } else if(savedApiUrl) {
            fetchGoogleSheetApi();
        }

        if(attendees.length > 0) {
            calculateAll();
        }
    }

    function resetAll() {
        if(confirm("⚠️ 작성 중인 모든 점수와 참석자 데이터가 초기화됩니다. 계속하시겠습니까?")) {
            localStorage.removeItem(STORAGE_KEY);
            attendees = [];
            location.reload();
        }
    }

    function showToast(message) {
        let toast = document.createElement("div");
        toast.className = "alert alert-info position-fixed bottom-0 end-0 m-3";
        toast.style.zIndex = "2000";
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function openTab(tabName) {
        let items = document.getElementsByClassName("tab-content-item");
        for (let i = 0; i < items.length; i++) items[i].style.display = "none";
        
        let navs = document.querySelectorAll(".nav-link");
        navs.forEach(nav => nav.classList.remove("active"));

        document.getElementById("tab-" + tabName).style.display = "block";
        document.getElementById(tabName + "-tab").classList.add("active");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function fetchGoogleSheetApi() {
        let url = document.getElementById("apiUrl").value.trim();
        if(!url) { alert("Apps Script API URL을 입력해 주세요."); return; }
        localStorage.setItem(API_URL_KEY, url);

        try {
            let res = await fetch(url);
            let data = await res.json();
            let list = Array.isArray(data) ? data : (data.members || data.data || []);

            if(list.length > 0) {
                let parsedText = "";
                list.forEach(item => {
                    let name = item.name || item[0];
                    let ave = item.ave || item.average || item[1];
                    let gender = item.gender || item[2] || '남';
                    let attendRate = item.attendRate || item[3] || 0;
                    if(name && ave) parsedText += `${name} ${ave} ${gender} ${attendRate}\n`;
                });
                document.getElementById("memberDBText").value = parsedText.trim();
                saveMemberDB();
                showToast("✅ 명단 동기화 완료!");
            }
        } catch(err) { alert("API 연결 중 오류가 발생했습니다."); }
    }

    function saveMemberDB() {
        let text = document.getElementById("memberDBText").value;
        localStorage.setItem(MEMBER_DB_KEY, text);
        parseMemberDB();
    }

    function parseMemberDB() {
        let text = document.getElementById("memberDBText").value;
        let lines = text.split("\n");
        membersDB = [];
        let container = document.getElementById("attendeeCheckboxes");
        container.innerHTML = "";

        lines.forEach((line, index) => {
            let parts = line.trim().split(/\s+/);
            if(parts.length >= 2) {
                let name = parts[0];
                let ave = parseInt(parts[1]) || 0;
                let gender = parts[2] || '남';
                let attendRate = parseFloat(parts[3]) || 0;

                let autoCheck = attendRate >= 50;
                membersDB.push({ name, ave, gender, attendRate });

                let div = document.createElement("div");
                div.className = `member-card ${autoCheck ? 'checked' : ''}`;
                div.innerHTML = `
                    <div class="member-info d-flex align-items-center justify-content-between">
                        <label class="form-check-label d-flex align-items-center gap-2 m-0 flex-grow-1">
                            <input class="form-check-input member-check" type="checkbox" value="${index}" ${autoCheck ? 'checked' : ''} onchange="updateMemberCard(this)">
                            <span class="fw-bold">${name}</span>
                            <span class="badge ${gender === '여' || gender === 'F' ? 'bg-danger' : 'bg-secondary'}">${gender}</span>
                            <span class="text-muted small">Avg ${ave}</span>
                        </label>
                    </div>
                    <div class="member-options">
                        <label class="member-option-label"><input type="checkbox" id="side_${index}" checked> 사이드</label>
                        <label class="member-option-label"><input type="checkbox" id="ac_${index}" checked> AC</label>
                        <label class="member-option-label"><input type="checkbox" id="tt_${index}" checked> TT</label>
                    </div>
                `;
                container.appendChild(div);
            }
        });
    }

    function updateMemberCard(checkbox) {
        let card = checkbox.closest(".member-card");
        if(checkbox.checked) card.classList.add("checked");
        else card.classList.remove("checked");
    }

    function loadAttendees() {
        let checkboxes = document.querySelectorAll(".member-check:checked");
        if(checkboxes.length === 0) { alert("참석할 멤버를 선택해주세요."); return; }

        attendees = [];
        checkboxes.forEach(chk => {
            let idx = parseInt(chk.value);
            let m = membersDB[idx];
            attendees.push({
                name: m.name,
                ave: m.ave,
                gender: m.gender,
                joinSide: document.getElementById(`side_${idx}`).checked,
                joinAC: document.getElementById(`ac_${idx}`).checked,
                joinTT: document.getElementById(`tt_${idx}`).checked,
                isPaid: false,
                g1: 0, g2: 0, g3: 0, g4: 0,
                acSuccess: [false, false, false, false],
                ttSuccess: [false, false, false, false],
                acPrize: 0,
                ttPrize: 0
            });
        });

        attendees.sort((a, b) => b.ave - a.ave);
        saveState();
        renderGameTables();
        calculateAll();
        showToast("✅ 참석자 확정 완료");
        openTab('fee');
    }

    function renderFeeTable() {
        let tbody = document.getElementById("feeTableBody");
        if (!tbody) return;
        tbody.innerHTML = "";

        let baseGame = parseInt(document.getElementById("gameFee").value) || 0;
        let baseTeam = parseInt(document.getElementById("teamFee").value) || 0;
        let baseSide = parseInt(document.getElementById("sideFee").value) || 0;

        let paidCount = 0;
        attendees.forEach((a, idx) => {
            let playedGames = 0;
            for(let g=1; g<=4; g++) { if(a['g'+g] !== undefined && a['g'+g] !== '' && a['g'+g] > 0) playedGames++; }
            if(playedGames === 0) playedGames = 4; // 기본 4게임 세팅

            let sideVal = a.joinSide ? baseSide : 0;

            // 기본 미션 참가비 계산 (AC 8,000 / TT 4,000)
            let acFeePerGame = 2000;
            let ttFeePerGame = 1000;
            let acFee = a.joinAC ? (acFeePerGame * playedGames) : 0;
            let ttFee = a.joinTT ? (ttFeePerGame * playedGames) : 0;

            // 4게임까지 전부 마친 상태에서만 환불(0원) 적용
            if (a.acRefund) acFee = 0;
            if (a.ttRefund) ttFee = 0;

            let missionVal = acFee + ttFee;
            let total = baseGame + baseTeam + sideVal + missionVal;

            if (a.isPaid) paidCount++;

            let tr = document.createElement("tr");
            if (a.isPaid) tr.className = "paid-row";

            tr.innerHTML = `
                <td class="fw-bold">${a.name}</td>
                <td>${baseGame.toLocaleString()}</td>
                <td>${baseTeam.toLocaleString()}</td>
                <td>${sideVal.toLocaleString()}</td>
                <td>${missionVal.toLocaleString()}${ (a.acRefund || a.ttRefund) ? '<br><small class="text-danger">(환불됨)</small>' : '' }</td>
                <td class="fw-bold text-primary">${total.toLocaleString()}원</td>
                <td><input type="checkbox" class="paid-check-input" ${a.isPaid ? 'checked' : ''} onchange="togglePaid(${idx}, this.checked)"></td>
            `;
            tbody.appendChild(tr);
        });

        let paidBadge = document.getElementById("paidSummaryBadge");
        if (paidBadge) paidBadge.innerText = `입금완료: ${paidCount} / ${attendees.length}명`;
    }

    function togglePaid(idx, checked) {
        attendees[idx].isPaid = checked;
        saveState();
        renderFeeTable();
    }

    function renderGameTables() {
        for(let g = 1; g <= 4; g++) {
            let container = document.getElementById(`g${g}ScoreInputs`);
            if (!container) continue;
            container.innerHTML = "";
            attendees.forEach((a, idx) => {
                let div = document.createElement("div");
                div.className = "score-input-row";
                div.innerHTML = `
                    <div class="name-area">
                        <span class="name">${a.name}</span>
                        <span class="badge ${a.gender === '여' || a.gender === 'F' ? 'bg-danger' : 'bg-secondary'}" style="width:fit-content">${a.gender}</span>
                    </div>
                    <input type="number" inputmode="numeric" class="form-control form-control-sm" min="0" max="300" value="${a['g'+g] || ''}" placeholder="점수" onchange="updateScore(${idx}, ${g}, this.value)">
                    <span class="score-result" id="handi_${g}_${idx}">-</span>
                    <div class="mission-checks">
                        <label><input type="checkbox" ${!a.joinAC ? 'disabled' : ''} ${a.acSuccess[g-1] ? 'checked' : ''} onchange="updateMission(${idx}, ${g}, 'ac', this.checked)"> AC</label>
                        <label><input type="checkbox" ${!a.joinTT ? 'disabled' : ''} ${a.ttSuccess[g-1] ? 'checked' : ''} onchange="updateMission(${idx}, ${g}, 'tt', this.checked)"> TT</label>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    }

    function updateScore(idx, game, val) {
        let score = parseInt(val) || 0;
        if(score > 300) { alert("볼링 최고 점수는 300점입니다."); score = 300; }
        if(score < 0) score = 0;
        
        attendees[idx]['g' + game] = score;
        calculateAll();
        saveState();
    }

    function updateMission(idx, game, type, checked) {
        if (type === 'ac') attendees[idx].acSuccess[game - 1] = checked;
        else if (type === 'tt') attendees[idx].ttSuccess[game - 1] = checked;
        calculateAll();
        saveState();
    }

    function calculateAll() {
        let femaleHandicap = parseInt(document.getElementById("femaleHandicap").value) || 0;
        let maleLimit = parseInt(document.getElementById("maleLimit").value) || 210;
        let femaleLimit = parseInt(document.getElementById("femaleLimit").value) || 200;

        // 4게임이 모두 완료되었는지 체크 (모든 참가자가 4G 점수를 입력했는지 확인)
        let isAll4GamesFinished = attendees.length > 0 && attendees.every(a => a.g4 !== undefined && a.g4 !== '' && a.g4 > 0);

        // 1. 핸디캡 및 점수 계산
        attendees.forEach((a, idx) => {
            for (let g = 1; g <= 4; g++) {
                let rawScore = a['g' + g] || 0;
                let handiScore = rawScore;

                if (a.gender === '여' || a.gender === 'F') {
                    handiScore += femaleHandicap;
                    if (a.ave > femaleLimit && rawScore > 0) handiScore = Math.min(handiScore, femaleLimit);
                } else {
                    if (a.ave > maleLimit && rawScore > 0) handiScore = Math.min(handiScore, maleLimit);
                }

                a['g' + g + '_calculated'] = handiScore;
                let el = document.getElementById(`handi_${g}_${idx}`);
                if (el) el.innerText = rawScore > 0 ? `${handiScore}점` : '-';
            }
            a.acPrize = 0;
            a.ttPrize = 0;
            a.acRefund = false;
            a.ttRefund = false;
        });

        // 2. 이월 및 미션 상금 정산 (올카바 AC)
        let acCarryOver = 0;
        let acAnyWinnerIn4Games = false;
        for (let g = 1; g <= 4; g++) {
            let activeAcCount = attendees.filter(a => a.joinAC).length;
            let currentPool = (activeAcCount * 2000) + acCarryOver;
            let winners = attendees.filter(a => a.joinAC && a.acSuccess[g - 1]);

            if (winners.length > 0) {
                acAnyWinnerIn4Games = true;
                let prizePerWinner = Math.floor(currentPool / winners.length);
                winners.forEach(w => w.acPrize += prizePerWinner);
                acCarryOver = 0;
            } else {
                acCarryOver = currentPool;
            }
        }
        // 4게임이 모두 완료되었고 성공자가 0명일 때만 환불 처리
        if (isAll4GamesFinished && !acAnyWinnerIn4Games) {
            attendees.forEach(a => { if(a.joinAC) a.acRefund = true; });
        }

        // 3. 이월 및 미션 상금 정산 (텐터키 TT)
        let ttCarryOver = 0;
        let ttAnyWinnerIn4Games = false;
        for (let g = 1; g <= 4; g++) {
            let activeTtCount = attendees.filter(a => a.joinTT).length;
            let currentPool = (activeTtCount * 1000) + ttCarryOver;
            let winners = attendees.filter(a => a.joinTT && a.ttSuccess[g - 1]);

            if (winners.length > 0) {
                ttAnyWinnerIn4Games = true;
                let prizePerWinner = Math.floor(currentPool / winners.length);
                winners.forEach(w => w.ttPrize += prizePerWinner);
                ttCarryOver = 0;
            } else {
                ttCarryOver = currentPool;
            }
        }
        // 4게임이 모두 완료되었고 성공자가 0명일 때만 환불 처리
        if (isAll4GamesFinished && !ttAnyWinnerIn4Games) {
            attendees.forEach(a => { if(a.joinTT) a.ttRefund = true; });
        }

        renderFeeTable();
        renderMissionSummaries();
        renderPrizeTable();
    }

    function renderMissionSummaries() {
        for (let g = 1; g <= 4; g++) {
            let acWinners = attendees.filter(a => a.acSuccess[g - 1]);
            let ttWinners = attendees.filter(a => a.ttSuccess[g - 1]);

            let summaryBox = document.getElementById(`g${g}MissionSummary`);
            if (summaryBox) {
                if (acWinners.length === 0 && ttWinners.length === 0) {
                    summaryBox.style.display = "block";
                    summaryBox.innerHTML = `<div class="small text-muted text-center">🎯 ${g}G 미션 성공자 없음 (다음 게임으로 이월)</div>`;
                } else {
                    summaryBox.style.display = "block";
                    summaryBox.innerHTML = `
                        <div class="fw-bold mb-1"><i class="fas fa-flag-checkered"></i> ${g}G 미션 성공 현황</div>
                        <div class="small">🎯 <strong>올카바(AC)</strong>: ${acWinners.map(a => a.name).join(', ') || '없음(이월)'} (${acWinners.length}명)</div>
                        <div class="small">🎳 <strong>텐터키(TT)</strong>: ${ttWinners.map(a => a.name).join(', ') || '없음(이월)'} (${ttWinners.length}명)</div>
                    `;
                }
            }
        }
    }

    function renderPrizeTable() {
        let prizeContainer = document.getElementById("prizeTableBody");
        if (!prizeContainer) return;

        let rankedList = [...attendees].map(a => {
            let total = (a.g1_calculated || 0) + (a.g2_calculated || 0) + (a.g3_calculated || 0) + (a.g4_calculated || 0);
            let avg = (total / 4).toFixed(1);
            let totalMissionPrize = (a.acPrize || 0) + (a.ttPrize || 0);
            return { ...a, total, avg, totalMissionPrize };
        });

        rankedList.sort((a, b) => b.total - a.total);

        prizeContainer.innerHTML = "";
        rankedList.forEach((a, idx) => {
            let div = document.createElement("div");
            div.className = "result-row";
            div.innerHTML = `
                <div class="result-rank">${idx + 1}</div>
                <div class="result-info">
                    <div class="name">${a.name} <span class="badge ${a.gender === '여' || a.gender === 'F' ? 'bg-danger' : 'bg-secondary'}">${a.gender}</span></div>
                    <div class="score">평균 ${a.avg}점 (1G: ${a.g1_calculated||0} / 2G: ${a.g2_calculated||0} / 3G: ${a.g3_calculated||0} / 4G: ${a.g4_calculated||0})</div>
                    ${a.totalMissionPrize > 0 ? `<div class="text-success fw-bold small">🎁 미션 상금: ${a.totalMissionPrize.toLocaleString()}원</div>` : ''}
                </div>
                <div class="result-score">${a.total}점</div>
            `;
            prizeContainer.appendChild(div);
        });

        let totalGameFee = attendees.length * (parseInt(document.getElementById("gameFee").value) || 0);
        let totalTeamFee = attendees.length * (parseInt(document.getElementById("teamFee").value) || 0);
        let sideCount = attendees.filter(a => a.joinSide).length;
        let totalSideFee = sideCount * (parseInt(document.getElementById("sideFee").value) || 0);

        let settlementEl = document.getElementById("settlementSummary");
        if (settlementEl) {
            settlementEl.innerHTML = `
                <div class="row text-start small">
                    <div class="col-6 mb-1"><strong>총 참석자:</strong> ${attendees.length}명</div>
                    <div class="col-6 mb-1"><strong>사이드 참여:</strong> ${sideCount}명</div>
                    <div class="col-6 mb-1"><strong>게임비 총액:</strong> ${totalGameFee.toLocaleString()}원</div>
                    <div class="col-6 mb-1"><strong>팀전비 총액:</strong> ${totalTeamFee.toLocaleString()}원</div>
                    <div class="col-12 mt-1"><strong>사이드 총 적립금:</strong> <span class="text-primary fw-bold">${totalSideFee.toLocaleString()}원</span></div>
                </div>
            `;
        }
    }

    function copyKakaoSummary() {
        if(attendees.length === 0) { alert("정산할 데이터가 없습니다."); return; }

        let rankedList = [...attendees].map(a => {
            let total = (a.g1_calculated || 0) + (a.g2_calculated || 0) + (a.g3_calculated || 0) + (a.g4_calculated || 0);
            let totalMissionPrize = (a.acPrize || 0) + (a.ttPrize || 0);
            return { name: a.name, total, avg: (total/4).toFixed(1), totalMissionPrize };
        }).sort((a, b) => b.total - a.total);

        let text = `🎳 [Burning crew B.C 정산 결과]\n\n`;
        text += `🏆 최종 순위:\n`;
        rankedList.slice(0, 3).forEach((r, i) => {
            text += `${i+1}위: ${r.name} (${r.total}점 / Avg ${r.avg})\n`;
        });

        let missionWinners = rankedList.filter(r => r.totalMissionPrize > 0);
        if(missionWinners.length > 0) {
            text += `\n🎯 미션 상금 획득:\n`;
            missionWinners.forEach(m => {
                text += `• ${m.name}: ${m.totalMissionPrize.toLocaleString()}원\n`;
            });
        } else {
            text += `\n🎯 미션 상금: 4G 미성공으로 환불 처리 완료\n`;
        }

        text += `\n👥 총 참석자: ${attendees.length}명\n`;
        text += `💰 사이드 참가: ${attendees.filter(a => a.joinSide).length}명\n\n`;
        text += `모두 수고하셨습니다!👏`;

        navigator.clipboard.writeText(text).then(() => {
            showToast("📋 카톡 공유용 텍스트 복사 완료!");
        }).catch(() => alert("복사에 실패했습니다."));
    }

  async function saveToGoogleSheet() {
  const scriptUrl = document.getElementById('scriptUrl')?.value?.trim();
  if (!scriptUrl) {
    alert("⚠️ 구글 앱스 스크립트 API URL이 입력되지 않았습니다.");
    return;
  }

  // 1. 참석 체크된 회원만 필터링
  const attendingMembers = members.filter(m => m.isAttending);
  
  if (attendingMembers.length === 0) {
    alert("⚠️ 참석 체크된 회원이 없습니다. 명단을 확인해 주세요.");
    return;
  }

  // 2. 점수 누락 및 잘못된 값 검사
  const incompleteMembers = [];

  attendingMembers.forEach(m => {
    const missingGames = [];
    for (let i = 0; i < 4; i++) {
      // 점수가 없거나, 빈 문자열이거나, 숫자가 아닌(NaN) 경우 체크
      const score = m.scores ? m.scores[i] : null;
      if (score === null || score === undefined || String(score).trim() === '' || isNaN(score)) {
        missingGames.push(`${i + 1}게임`);
      }
    }

    if (missingGames.length > 0) {
      incompleteMembers.push(`• ${m.name}: [ ${missingGames.join(', ')} ] 점수 누락`);
    }
  });

  // 3. 점수가 누락된 회원이 있다면 상세 알림을 띄우고 저장 차단
  if (incompleteMembers.length > 0) {
    alert(
      "⚠️ 아래 회원의 게임 점수가 누락되었습니다!\n" +
      "점수를 입력하신 후 다시 저장해 주세요.\n\n" +
      incompleteMembers.join("\n")
    );
    return; // 저장을 진행하지 않고 중단
  }

  // 4. 모든 점수가 입력된 경우에만 구글 시트로 안전하게 전송
  try {
    await fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ attendees: attendingMembers })
    });
    alert("☁️ 구글 시트로 최종 저장이 완료되었습니다!");
  } catch (e) {
    alert("구글 시트 저장 중 오류가 발생했습니다: " + e.message);
  }
}
</script>
