<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning crew B.C</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; padding-bottom: 50px; }
        
        header { background: #001f3f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 2px solid #0056b3; }
        
        /* Tab Navigation */
        .tab-nav { display: flex; background: #1e1e1e; border-bottom: 1px solid #333; overflow-x: auto; white-space: nowrap; position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; min-width: 60px; padding: 12px 8px; text-align: center; background: transparent; color: #aaa; border: none; font-size: 13px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #fff; background: #0056b3; border-bottom-color: #007bff; }
        
        /* Tab Contents */
        .tab-content { display: none; padding: 15px; max-width: 700px; margin: 0 auto; }
        .tab-content.active { display: block; }
        
        .section-title { font-size: 1rem; margin-bottom: 12px; color: #64b5f6; font-weight: bold; }
        .notice-box { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; margin-bottom: 15px; color: #94a3b8; line-height: 1.4; }
        
        /* Cards */
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; }
        
        /* Inputs */
        textarea { width: 100%; height: 140px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 13px; margin-bottom: 10px; }
        input[type="number"] { width: 65px; height: 38px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; text-align: center; font-size: 15px; font-weight: bold; }
        
        .checkbox-group { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
        .chk-label { font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; background: #2a2a2a; padding: 4px 6px; border-radius: 4px; color: #ccc; }
        .chk-label input { transform: scale(1.1); }
        
        .btn { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 8px; cursor: pointer; font-size: 14px; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #333; padding: 8px 6px; text-align: center; }
        th { background: #003366; color: #fff; }
        td { color: #ddd; }
    </style>
</head>
<body>

<header>🎳 Burning crew B.C 통합 정산</header>

<!-- 탭 메뉴 -->
<div class="tab-nav">
    <button class="tab-btn active" onclick="openTab('tab-set')">⚙️ 설정/참석</button>
    <button class="tab-btn" onclick="openTab('tab-money')">💰 걷을 돈</button>
    <button class="tab-btn" onclick="openTab('tab-g1')">1G</button>
    <button class="tab-btn" onclick="openTab('tab-g2')">2G</button>
    <button class="tab-btn" onclick="openTab('tab-g3')">3G</button>
    <button class="tab-btn" onclick="openTab('tab-g4')">4G</button>
    <button class="tab-btn" onclick="openTab('tab-rank')">🏆 최종순위/정산</button>
</div>

<!-- 1. 설정 및 참석자 탭 -->
<div id="tab-set" class="tab-content active">
    <div class="section-title">회원 DB 입력 및 에버순 정렬</div>
    <div class="notice-box">형식: [이름] [에버리지] [성별(남/여)]<br>(예: 반기용 209 남)</div>
    <textarea id="dbInput">반기용 209 남
장호정 207 남
강찬희 205 남
이학열 201 남
이만영 198 남
윤혜진 197 여
김진선 196 남
서수현 196 남
박민민 192 남
최영남 190 남</textarea>
    <button class="btn" onclick="loadMembers()">참여자 등록 및 에버순 정렬</button>
</div>

<!-- 2. 걷을 돈 탭 -->
<div id="tab-money" class="tab-content">
    <div class="section-title">💵 사전 걷을 돈 및 옵션 체크</div>
    <div class="notice-box">
        기본게임비: <input type="number" id="gameFee" value="14000" onchange="renderMoneyTable()" style="width:70px">원 | 
        팀전비: <input type="number" id="teamFee" value="8000" onchange="renderMoneyTable()" style="width:70px">원<br>
        사이드: <input type="number" id="sideFee" value="20000" onchange="renderMoneyTable()" style="width:70px">원
    </div>
    <div id="moneyCardList"></div>
    <div id="moneySummary" class="notice-box" style="margin-top:15px; text-align:left; font-size:12px;"></div>
</div>

<!-- 3~6. 게임별 1G~4G 탭 -->
<div id="tab-g1" class="tab-content"><div class="section-title">1게임 점수 입력 및 미션 체크</div><div id="g1CardList"></div></div>
<div id="tab-g2" class="tab-content"><div class="section-title">2게임 점수 입력 및 미션 체크</div><div id="g2CardList"></div></div>
<div id="tab-g3" class="tab-content"><div class="section-title">3게임 점수 입력 및 미션 체크</div><div id="g3CardList"></div></div>
<div id="tab-g4" class="tab-content"><div class="section-title">4게임 점수 입력 및 미션 체크</div><div id="g4CardList"></div></div>

<!-- 7. 최종 순위 및 정산 탭 -->
<div id="tab-rank" class="tab-content">
    <div class="section-title">🏆 게임별 1~3위 및 최종 정산</div>
    <div id="rankResultArea"></div>
</div>

<script>
    let members = [];

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'tab-money') renderMoneyTable();
        if(tabId.startsWith('tab-g')) renderGameTab(tabId.replace('tab-', ''));
        if(tabId === 'tab-rank') renderRankAndSettlement();
    }

    function loadMembers() {
        const text = document.getElementById('dbInput').value.trim();
        members = text.split('\n').map(line => {
            const parts = line.trim().split(/\s+/);
            return {
                name: parts[0],
                avg: parseInt(parts[1]) || 0,
                gender: parts[2] || '남',
                joinSide: true,
                joinAC: true,
                joinTT: true,
                g1: '', g2: '', g3: '', g4: '',
                ac1: false, ac2: false, ac3: false, ac4: false,
                tt1: false, tt2: false, tt3: false, tt4: false
            };
        });
        // 에버순 정렬
        members.sort((a, b) => b.avg - a.avg);
        alert('참여자 등록 완료! 에버순으로 정렬되었습니다.');
        openTab('tab-money');
    }

    function renderMoneyTable() {
        const container = document.getElementById('moneyCardList');
        container.innerHTML = '';
        
        let bGame = parseInt(document.getElementById('gameFee').value) || 0;
        let bTeam = parseInt(document.getElementById('teamFee').value) || 0;
        let bSide = parseInt(document.getElementById('sideFee').value) || 0;

        let totalCash = 0, sumGame = 0, sumTeam = 0, sumAC = 0, sumTT = 0, sumSide = 0;

        members.forEach((m, idx) => {
            let sVal = m.joinSide ? bSide : 0;
            let mVal = (m.joinAC ? 8000 : 0) + (m.joinTT ? 4000 : 0);
            let total = bGame + bTeam + sVal + mVal;

            totalCash += total;
            sumGame += bGame;
            sumTeam += bTeam;
            if(m.joinAC) sumAC += 8000;
            if(m.joinTT) sumTT += 4000;
            if(m.joinSide) sumSide += bSide;

            container.innerHTML += `
                <div class="card flex-row">
                    <div>
                        <strong>${m.name}</strong> <span style="font-size:11px; color:#888;">(${m.avg}점)</span>
                        <div class="checkbox-group">
                            <label class="chk-label"><input type="checkbox" ${m.joinSide?'checked':''} onchange="members[${idx}].joinSide=this.checked; renderMoneyTable()"> 사이드</label>
                            <label class="chk-label"><input type="checkbox" ${m.joinAC?'checked':''} onchange="members[${idx}].joinAC=this.checked; renderMoneyTable()"> 올카바(8천)</label>
                            <label class="chk-label"><input type="checkbox" ${m.joinTT?'checked':''} onchange="members[${idx}].joinTT=this.checked; renderMoneyTable()"> 텐터키(4천)</label>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:16px; font-weight:bold; color:#4dabf7;">${total.toLocaleString()}원</span>
                    </div>
                </div>
            `;
        });

        document.getElementById('moneySummary').innerHTML = `
            <strong>📊 현장 수령 총액 요약:</strong><br>
            - 오늘 걷을 총 현금: <span style="color:#4dabf7">${totalCash.toLocaleString()}원</span><br>
            - 게임비 합계: ${sumGame.toLocaleString()}원 | 팀전비 합계: ${sumTeam.toLocaleString()}원<br>
            - 올카바 총액: ${sumAC.toLocaleString()}원 | 텐터키 총액: ${sumTT.toLocaleString()}원<br>
            - 사이드 총액: ${sumSide.toLocaleString()}원
        `;
    }

    function renderGameTab(gKey) {
        const container = document.getElementById(`${gKey}CardList`);
        container.innerHTML = '';

        members.forEach((m, idx) => {
            container.innerHTML += `
                <div class="card flex-row">
                    <div>
                        <strong>${m.name}</strong> <span style="font-size:11px; color:#888;">(에버:${m.avg})</span>
                        <div class="checkbox-group">
                            <label class="chk-label" style="${m.joinAC?'':'opacity:0.3'}">
                                <input type="checkbox" ${m['ac'+gKey.replace('g','') ]?'checked':''} ${m.joinAC?'':'disabled'} onchange="members[${idx}].ac${gKey.replace('g','')}=this.checked"> 올카바 성공
                            </label>
                            <label class="chk-label" style="${m.joinTT?'':'opacity:0.3'}">
                                <input type="checkbox" ${m['tt'+gKey.replace('g','') ]?'checked':''} ${m.joinTT?'':'disabled'} onchange="members[${idx}].tt${gKey.replace('g','')}=this.checked"> 텐터키 성공
                            </label>
                        </div>
                    </div>
                    <div>
                        <input type="number" placeholder="점수" value="${m[gKey]}" onchange="members[${idx}]['${gKey}']=this.value">
                    </div>
                </div>
            `;
        });
    }

    function renderRankAndSettlement() {
        const area = document.getElementById('rankResultArea');
        let html = '';

        // 핸디 적용 점수 계산 (여성 +15 등 필요시 적용 가능, 여기서는 입력 점수 그대로 또는 에버 기준 활용)
        // 게임별 1~3위 산출
        ['g1', 'g2', 'g3', 'g4'].forEach((g, idx) => {
            let sortedGame = [...members]
                .filter(m => m[g] !== '')
                .map(m => ({ name: m.name, score: parseInt(m[g]) || 0 }))
                .sort((a, b) => b.score - a.score);

            html += `<div class="card"><strong>[ ${idx+1}게임 순위 ]</strong><div style="font-size:12px; margin-top:5px; color:#aaa;">`;
            if(sortedGame.length === 0) {
                html += `입력된 점수가 없습니다.`;
            } else {
                sortedGame.forEach((item, rank) => {
                    if(rank < 3) html += `${rank+1위}: ${item.name} (${item.score}점) &nbsp;&nbsp;`;
                });
            }
            html += `</div></div>`;
        });

        area.innerHTML = html;
    }

    window.onload = function() { loadMembers(); };
</script>
</body>
</html>
